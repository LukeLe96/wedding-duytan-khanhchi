<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Trò Chuyện Cùng Tân & Chi — Thiệp Cưới Trực Tuyến</title>

  <!-- OpenGraph / Social Sharing Metadata -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://wedding.tahi.vn/chat">
  <meta property="og:title" content="Trò chuyện cùng Duy Tân & Khánh Chi • Thiệp Cưới 2027">
  <meta property="og:description" content="Trải nghiệm thiệp cưới dạng hội thoại ấm áp của Lê Duy Tân & Đinh Khánh Chi.">
  <meta property="og:image" content="https://wedding.tahi.vn/assets/couple_hero.jpg">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">

  <!-- Google Fonts: Playfair Display & Be Vietnam Pro & Alex Brush -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap&subset=vietnamese" rel="stylesheet">

  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ruby: {
              DEFAULT: '#8B1E2D',
              deep: '#722F37',
              dark: '#5A1F27',
              light: '#FBF3F4'
            },
            gold: {
              DEFAULT: '#C5A059',
              bright: '#D4AF37',
              dark: '#86672F',
              light: '#FBF7EC'
            }
          },
          fontFamily: {
            display: ['"Playfair Display"', 'Georgia', 'serif'],
            sans: ['"Be Vietnam Pro"', 'sans-serif'],
            script: ['"Alex Brush"', 'cursive'],
          }
        }
      }
    };
  </script>

  <style>
    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      background-color: #F8F6F2;
      background-image: radial-gradient(circle at 15% 20%, rgba(212,175,55,0.035) 0%, transparent 45%),
                        radial-gradient(circle at 85% 80%, rgba(139,30,45,0.035) 0%, transparent 45%);
    }

    /* Clean Scrollbars */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Typing Dots Animation */
    @keyframes typingDot {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-5px); opacity: 1; }
    }
    .typing-dot-1 { animation: typingDot 1.3s infinite 0.0s; }
    .typing-dot-2 { animation: typingDot 1.3s infinite 0.2s; }
    .typing-dot-3 { animation: typingDot 1.3s infinite 0.4s; }

    /* Bubble Entry Animation */
    @keyframes bubbleIn {
      from { opacity: 0; transform: translateY(10px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .bubble-animate {
      animation: bubbleIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Spinning Disc */
    @keyframes spinDisc {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-spin-slow {
      animation: spinDisc 10s linear infinite;
    }
    .anim-paused {
      animation-play-state: paused;
    }

    /* ===== Pixel Couple Mascot (16-bit chibi, inline SVG sprite) ===== */
    .px-art {
      display: block;
      shape-rendering: crispEdges;
      image-rendering: pixelated;
      transform-origin: 50% 100%;
    }
    .px-couple {
      position: relative;
      display: inline-flex;
      align-items: flex-end;
    }
    .px-couple .px-bride { margin-left: -4px; }
    .px-heart {
      position: absolute;
      left: 50%;
      width: 14px;
      height: 12px;
      pointer-events: none;
    }

    /* Typing indicator: breathing + floating hearts */
    @keyframes pxBreathe {
      0%, 100% { transform: scale(1, 1); }
      50% { transform: scale(1.03, 1.06); }
    }
    @keyframes pxFloat {
      0% { transform: translate(-50%, 0) scale(0.5); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: translate(-50%, -16px) scale(1); opacity: 0; }
    }
    .px-typing .px-groom { animation: pxBreathe 1.4s ease-in-out infinite; }
    .px-typing .px-bride { animation: pxBreathe 1.4s ease-in-out infinite 0.35s; }
    .px-typing .px-heart {
      top: -6px;
      opacity: 0;
      animation: pxFloat 1.8s steps(6) infinite;
    }
    .px-typing .px-heart-late { animation-delay: 0.9s; }

    /* Header mascot: tap to bounce + burst of hearts */
    @keyframes pxBounce {
      0%, 100% { transform: translateY(0); }
      30% { transform: translateY(-8px); }
      50% { transform: translateY(0); }
      70% { transform: translateY(-3px); }
      85% { transform: translateY(0); }
    }
    @keyframes pxBurst {
      0% { transform: translate(-50%, 0) scale(0.4); opacity: 1; }
      70% { opacity: 1; }
      100% { transform: translate(calc(-50% + var(--dx)), var(--dy)) scale(1); opacity: 0; }
    }
    .px-mascot.is-bouncing .px-groom { animation: pxBounce 0.6s ease-out; }
    .px-mascot.is-bouncing .px-bride { animation: pxBounce 0.6s ease-out 0.08s; }
    .px-mascot .px-heart {
      top: 30%;
      animation: pxBurst 0.9s steps(8) both;
    }

    /* Acrobatic Stunt: Run to corner, slide down edge, shoot cable & grapple up */
    .px-rope-vert {
      position: fixed;
      width: 2px;
      background: linear-gradient(to bottom, #F9E29D, #D4AF37, #99781A);
      z-index: 61;
      pointer-events: none;
      box-shadow: 0 0 6px rgba(212,175,55,0.7);
      transition: opacity 0.25s ease-out;
    }
    .px-grapple-wire {
      position: fixed;
      height: 2px;
      background: linear-gradient(to right, #D4AF37, #F9E29D);
      z-index: 61;
      pointer-events: none;
      transform-origin: 0 0;
      box-shadow: 0 0 8px rgba(212,175,55,0.85);
    }
    .px-stunt-actor {
      position: fixed;
      z-index: 62;
      pointer-events: none;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      transform-origin: 50% 0;
    }
    @keyframes pxRunBob {
      0% { transform: translateY(0) rotate(-4deg); }
      50% { transform: translateY(-4px) rotate(4deg); }
      100% { transform: translateY(0) rotate(-4deg); }
    }
    .px-runner-body {
      display: inline-flex;
      align-items: flex-end;
      animation: pxRunBob 0.2s steps(2) infinite alternate;
    }
    .px-bubble {
      background: rgba(255, 255, 255, 0.95);
      border: 1.5px solid #D4AF37;
      border-radius: 9999px;
      padding: 2px 8px;
      font-size: 10px;
      font-weight: 700;
      color: #8B1E2D;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      margin-bottom: 3px;
      animation: pxBreathe 1s ease-in-out infinite;
    }
    .px-trail-drop {
      position: fixed;
      pointer-events: none;
      z-index: 61;
      font-size: 11px;
      animation: pxFloat 1s ease-out forwards;
    }

    @media (prefers-reduced-motion: reduce) {
      .px-typing .px-art,
      .px-mascot.is-bouncing .px-art,
      .px-runner-body { animation: none; }
      .px-typing .px-heart,
      .px-rope-vert,
      .px-grapple-wire,
      .px-stunt-actor { display: none !important; }
    }
  </style>
</head>
<body class="h-full flex flex-col overflow-hidden text-stone-800 antialiased select-none">

  <svg width="0" height="0" class="absolute" aria-hidden="true" focusable="false">

      <path fill="#F7D4B6" d="M3 3h6v1h-6zM2 4h1v3h-1zM9 4h1v3h-1zM4 6h4v1h-4zM2 7h3v1h-3zM7 7h3v1h-3zM3 8h6v1h-6zM1 12h1v1h-1zM10 12h1v1h-1z"/>

      <path fill="#B3263A" d="M3 0h6v1h-6zM2 1h1v1h-1zM9 1h1v1h-1zM4 7h1v1h-1zM7 7h1v1h-1zM3 8h6v1h-6zM1 9h4v1h-4zM6 9h5v1h-5zM1 10h3v1h-3zM8 10h3v1h-3zM2 11h3v1h-3zM7 11h3v1h-3zM2 12h8v1h-8zM4 13h4v1h-4zM5 14h2v1h-2z"/>
      <path fill="#D4AF37" d="M3 1h6v1h-6zM5 7h2v1h-2zM5 9h1v1h-1z"/>
      <path fill="#F7D4B6" d="M3 2h6v1h-6zM3 3h1v1h-1zM5 3h2v1h-2zM8 3h1v1h-1zM4 4h4v1h-4zM3 5h2v1h-2zM7 5h2v1h-2zM4 6h4v1h-4zM4 10h1v1h-1zM7 10h1v1h-1z"/>

    <symbol id="px-heart" viewBox="0 0 7 6">
      <path fill="#E11D48" d="M1 0h2v1h-2zM4 0h2v1h-2zM0 1h1v1h-1zM2 1h5v1h-5zM0 2h7v1h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z"/>

  <!-- ============================================================== -->
  <!-- 1. CHAT TOP HEADER BAR (COMPACT)                            -->
  <!-- ============================================================== -->
  <header class="flex-none bg-white/95 backdrop-blur-md border-b border-stone-200/80 px-3 py-2 z-30 shadow-2xs">
    <div class="max-w-2xl mx-auto flex items-center justify-between">
      
      <!-- Left: Compact Avatar & Couple Names -->
      <div class="flex items-center gap-2.5">
        <div class="relative shrink-0">
          <img src="./assets/couple_hero.jpg" alt="Duy Tân & Khánh Chi" class="w-8 h-8 rounded-full object-cover object-center ring-1 ring-gold/50 shadow-2xs">
          <span class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 rounded-full bg-emerald-500 border border-white"></span>
        </div>
        <div class="leading-none">
          <div class="flex items-center gap-1">
            <h1 class="font-display font-bold text-stone-900 text-sm sm:text-base">Duy Tân &amp; Khánh Chi</h1>
            <span class="inline-flex items-center justify-center w-3.5 h-3.5 rounded-full bg-ruby text-white text-[9px]" title="Cặp đôi chính thức">✓</span>
          </div>
          <p id="chat-header-status" class="text-[10px] text-stone-500 flex items-center gap-1 mt-0.5">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
            <span>Lời ngỏ chung đôi • 16-17.01.2027 ✨</span>
          </p>
        </div>
        <button id="px-mascot" type="button" onclick="celebrateMascot()" aria-label="Chúc phúc Duy Tân & Khánh Chi" title="Chạm để chúc phúc 💕" class="px-couple px-mascot shrink-0 cursor-pointer active:scale-95 transition-transform">
          <svg class="px-art px-groom" width="24" height="32" aria-hidden="true"><use href="#px-groom"/></svg>
          <svg class="px-art px-bride" width="24" height="32" aria-hidden="true"><use href="#px-bride"/></svg>
        </button>
      </div>

      <!-- Right: Compact Music Button (No 'Trang web' button) -->
      <div class="flex items-center">
        <button id="audio-toggle-btn" onclick="toggleAudio()" aria-label="Bật/Tắt nhạc" class="w-8 h-8 rounded-full bg-stone-100 hover:bg-stone-200 text-stone-700 transition flex items-center justify-center border border-stone-200 active:scale-95 cursor-pointer shadow-2xs" title="Bật/Tắt nhạc Một Nhà">
          <div id="vinyl-icon" class="w-4.5 h-4.5 rounded-full bg-stone-900 border border-gold flex items-center justify-center animate-spin-slow anim-paused">
            <span class="w-1.5 h-1.5 rounded-full bg-gold"></span>
          </div>
        </button>
      </div>

    </div>
  </header>

  <!-- ============================================================== -->
  <!-- 2. CHAT STREAM (MESSAGES CONTAINER)                            -->
  <!-- ============================================================== -->
  <main id="chat-messages" class="flex-1 overflow-y-auto px-4 py-6 space-y-4 max-w-2xl w-full mx-auto scroll-smooth">
    <!-- Messages will be injected dynamically -->
  </main>

  <!-- TYPING INDICATOR (Shown while bot is "typing") -->
  <div id="typing-indicator" class="hidden px-4 max-w-2xl w-full mx-auto pb-2">
    <div class="flex items-end gap-2.5">
      <div class="px-couple px-typing shrink-0" aria-label="Tân & Chi đang soạn tin" role="img">
        <svg class="px-art px-groom" width="24" height="32" aria-hidden="true"><use href="#px-groom"/></svg>
        <svg class="px-art px-bride" width="24" height="32" aria-hidden="true"><use href="#px-bride"/></svg>
        <svg class="px-art px-heart" aria-hidden="true"><use href="#px-heart"/></svg>
        <svg class="px-art px-heart px-heart-late" aria-hidden="true"><use href="#px-heart"/></svg>
      </div>
      <div class="bg-white px-4 py-2.5 rounded-2xl rounded-bl-xs border border-stone-200/90 shadow-2xs flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-ruby/70 typing-dot-1"></span>
        <span class="w-2 h-2 rounded-full bg-ruby/70 typing-dot-2"></span>
        <span class="w-2 h-2 rounded-full bg-ruby/70 typing-dot-3"></span>
      </div>
    </div>
  </div>

  <!-- ============================================================== -->
  <!-- 3. QUICK SUGGESTION CHIPS (GỢI Ý HỎI NHANH)                     -->
  <!-- ============================================================== -->
  <div class="flex-none px-4 pt-2 pb-1.5 bg-gradient-to-t from-white via-white/95 to-transparent">
    <div class="max-w-2xl mx-auto flex gap-2 overflow-x-auto no-scrollbar py-1 text-xs">
      <button onclick="handleQuickSend('Xem lịch trình hôn lễ 📅')" class="shrink-0 px-3.5 py-1.5 rounded-full bg-stone-100 hover:bg-stone-200 text-stone-700 border border-stone-200/90 font-medium transition active:scale-95 cursor-pointer">
        📅 Lịch trình &amp; Địa điểm
      </button>
      <button onclick="handleQuickSend('Xem ảnh cưới của hai bạn 📸')" class="shrink-0 px-3.5 py-1.5 rounded-full bg-stone-100 hover:bg-stone-200 text-stone-700 border border-stone-200/90 font-medium transition active:scale-95 cursor-pointer">
        📸 Ngắm ảnh cưới
      </button>
      <button onclick="handleQuickSend('Mình muốn xác nhận tham dự cùng hai bạn 💌')" class="shrink-0 px-3.5 py-1.5 rounded-full bg-ruby-light hover:bg-ruby/15 text-ruby border border-ruby/30 font-semibold transition active:scale-95 cursor-pointer">
        💌 Báo tin tham dự
      </button>
      <button onclick="handleQuickSend('Gửi lời chúc mừng đến Tân & Chi ✨')" class="shrink-0 px-3.5 py-1.5 rounded-full bg-stone-100 hover:bg-stone-200 text-stone-700 border border-stone-200/90 font-medium transition active:scale-95 cursor-pointer">
        ✍️ Gửi lời chúc
      </button>
      <button onclick="handleQuickSend('Tâm sự mỏng & Mừng cưới từ xa 🎁')" class="shrink-0 px-3.5 py-1.5 rounded-full bg-stone-100 hover:bg-stone-200 text-stone-700 border border-stone-200/90 font-medium transition active:scale-95 cursor-pointer">
        🎁 Món quà phương xa
      </button>
      <button onclick="handleQuickSend('Kể cho tôi nghe chuyện tình của hai bạn 💍')" class="shrink-0 px-3.5 py-1.5 rounded-full bg-stone-100 hover:bg-stone-200 text-stone-700 border border-stone-200/90 font-medium transition active:scale-95 cursor-pointer">
        💍 Chuyện tình đôi mình
      </button>
    </div>
  </div>

  <!-- ============================================================== -->
  <!-- 4. CHAT INPUT BAR (WITH VOICE MICROPHONE)                   -->
  <!-- ============================================================== -->
  <footer class="flex-none bg-white border-t border-stone-200 px-3 py-2 z-30">
    <div class="max-w-2xl mx-auto">
      <form id="chat-form" onsubmit="handleFormSubmit(event)" class="flex items-center gap-1.5 sm:gap-2">
        
        <!-- Voice Input Microphone Button -->
        <button 
          id="chat-mic-btn" 
          type="button" 
          onclick="toggleVoiceRecognition()" 
          aria-label="Nói để nhắn tin"
          class="w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-stone-100 hover:bg-stone-200 text-stone-700 flex items-center justify-center transition shadow-2xs active:scale-90 shrink-0 cursor-pointer border border-stone-200 relative group"
          title="Nhấn để nói tiếng Việt 🎙️"
        >
          <span id="mic-pulse-ring" class="hidden absolute inset-0 rounded-full bg-red-500/30 animate-ping"></span>
          <svg id="mic-icon-svg" class="w-4 h-4 text-stone-600 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m-4 0h8M12 3a3 3 0 00-3 3v5a3 3 0 006 0V6a3 3 0 00-3-3z"/>
          </svg>
        </button>

        <!-- Text Input Field -->
        <input 
          id="chat-input" 
          type="text" 
          autocomplete="off"
          placeholder="Nhắn gửi hoặc nhấn micro để nói..." 
          class="flex-1 bg-stone-50 border border-stone-200 rounded-full px-4 py-2 text-sm focus:outline-none focus:border-ruby focus:bg-white transition text-stone-900 placeholder:text-stone-400"
        />

        <!-- Send Button -->
        <button 
          id="chat-send-btn" 
          type="submit" 
          aria-label="Gửi tin nhắn"
          class="w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-ruby hover:bg-ruby-dark text-white flex items-center justify-center transition shadow-xs active:scale-90 shrink-0 cursor-pointer"
        >
          <svg class="w-4 h-4 translate-x-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
          </svg>
        </button>

      </form>
    </div>
  </footer>

  <!-- ============================================================== -->
  <!-- 5. LIGHTBOX & MODALS                                           -->
  <!-- ============================================================== -->
  <!-- Photo Lightbox -->
  <div id="chat-lightbox" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/90 p-4 backdrop-blur-md" onclick="closeChatLightbox()">
    <div class="relative max-w-xl w-full flex flex-col items-center" onclick="event.stopPropagation()">
      <button onclick="closeChatLightbox()" class="absolute -top-12 right-0 text-white text-2xl font-bold p-2 active:scale-95 cursor-pointer">✕</button>
      <img id="lightbox-full-img" src="" alt="Ảnh cưới phóng to" class="max-h-[75vh] w-auto rounded-2xl shadow-2xl object-contain">
      <p id="lightbox-caption" class="text-white text-xs mt-3 font-serif italic text-center"></p>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast-msg" class="fixed top-5 left-1/2 -translate-x-1/2 z-[999] hidden px-5 py-2.5 rounded-full bg-stone-900/90 text-gold-bright text-xs font-bold border border-gold/40 shadow-2xl transition duration-300 pointer-events-none">
    <span id="toast-text">Thông báo</span>
  </div>

  <!-- Audio Element -->
  <!-- Background Music Player -->
  <audio id="wedding-audio" loop preload="none">
    <source src="./assets/mot_nha_dalab.mp3" type="audio/mp3">
  </audio>

  <!-- Dedicated Voice TTS Player for Mobile (playsinline, high priority) -->
  <audio id="voice-tts-audio" playsinline preload="auto"></audio>
    <source src="./assets/mot_nha_dalab.mp3" type="audio/mp3">
  </audio>

  <!-- ============================================================== -->
  <!-- 6. JAVASCRIPT CONVERSATIONAL ENGINE                           -->
  <!-- ============================================================== -->
  <script>
    // State variables
    let isPlayingAudio = false;
    let guestSlug = '';
    let guestData = null;
    let rsvpState = { step: null, side: 'groom', name: '', phone: '', attend: true, plusOne: 0, wish: '' };

    const chatContainer = document.getElementById('chat-messages');
    const typingIndicator = document.getElementById('typing-indicator');
    const chatInput = document.getElementById('chat-input');
    const audioElement = document.getElementById('wedding-audio');

    // Parse URL parameter ?g=slug
    function getUrlParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }

    // Audio controller
    function toggleAudio() {
      const vinyl = document.getElementById('vinyl-icon');
      if (!isPlayingAudio) {
        audioElement.play().then(() => {
          isPlayingAudio = true;
          vinyl.classList.remove('anim-paused');
          showToast('Đang phát: Một Nhà • Da LAB ♫');
        }).catch(err => console.log('Audio autoplay blocked', err));
      } else {
        audioElement.pause();
        isPlayingAudio = false;
        vinyl.classList.add('anim-paused');
        showToast('Đã tạm dừng âm nhạc ⏸');
      }
    }

    // Toast helper
    function showToast(text) {
      const toast = document.getElementById('toast-msg');
      const toastText = document.getElementById('toast-text');
      toastText.innerText = text;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 2500);
    }

    // Copy to clipboard
    function copySTK(acc, owner) {
      navigator.clipboard.writeText(acc).then(() => {
        showToast(`Đã sao chép số tài khoản của ${owner}! ✨`);
      }).catch(() => {
        alert('Số tài khoản: ' + acc);
      });
    }

    // Lightbox helper
    function openChatLightbox(src, caption) {
      document.getElementById('lightbox-full-img').src = src;
      document.getElementById('lightbox-caption').innerText = caption || '';
      document.getElementById('chat-lightbox').classList.remove('hidden');
      document.getElementById('chat-lightbox').classList.add('flex');
    }
    function closeChatLightbox() {
      document.getElementById('chat-lightbox').classList.add('hidden');
      document.getElementById('chat-lightbox').classList.remove('flex');
    }

    // Scroll to bottom
    function scrollToBottom() {
      setTimeout(() => {
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }, 50);
    }

    // Add message bubble
    let currentPlayingVoiceAudio = null;
    let audioContextUnlocked = false;

    function playVoiceAudio(btnEl) {
      if (!btnEl) return;
      const audioUrl = btnEl.getAttribute('data-audio') || '';
      const textToSpeak = btnEl.getAttribute('data-text') || '';
      const voicePlayer = document.getElementById('voice-tts-audio');

      // 1. If currently playing this audio, pause it
      if (voicePlayer && !voicePlayer.paused && voicePlayer.dataset.currentAudio === audioUrl) {
        voicePlayer.pause();
        btnEl.classList.remove('bg-ruby', 'text-white');
        btnEl.classList.add('bg-ruby-light/90', 'text-ruby');
        const lbl = btnEl.querySelector('.voice-btn-label');
        if (lbl) lbl.innerText = 'Nghe lại';
        const icon = btnEl.querySelector('.voice-btn-icon');
        if (icon) icon.innerText = '▶';
        return;
      }

      // 2. Stop any other playing voices
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      if (voicePlayer) {
        voicePlayer.pause();
      }

      document.querySelectorAll('.voice-play-btn').forEach(b => {
        b.classList.remove('bg-ruby', 'text-white');
        b.classList.add('bg-ruby-light/90', 'text-ruby');
        const lbl = b.querySelector('.voice-btn-label');
        if (lbl) lbl.innerText = 'Nghe giọng đọc';
        const icon = b.querySelector('.voice-btn-icon');
        if (icon) icon.innerText = '🔊';
      });

      // 3. Mark current button as playing
      btnEl.classList.remove('bg-ruby-light/90', 'text-ruby');
      btnEl.classList.add('bg-ruby', 'text-white');
      const lbl = btnEl.querySelector('.voice-btn-label');
      if (lbl) lbl.innerText = 'Đang phát...';
      const icon = btnEl.querySelector('.voice-btn-icon');
      if (icon) icon.innerText = '⏸';

      // 4. Play MP3 via HTML5 Audio with background music ducking
      const bgAudio = document.getElementById('wedding-audio');
      if (bgAudio && !bgAudio.paused) {
        bgAudio.pause();
        window._wasBgAudioPlaying = true;
      }

      const resetBtn = () => {
        btnEl.classList.remove('bg-ruby', 'text-white');
        btnEl.classList.add('bg-ruby-light/90', 'text-ruby');
        if (lbl) lbl.innerText = 'Nghe lại';
        if (icon) icon.innerText = '↺';
        if (window._wasBgAudioPlaying && bgAudio) {
          bgAudio.play().catch(() => {});
          window._wasBgAudioPlaying = false;
        }
      };

      if (audioUrl && voicePlayer) {
        voicePlayer.src = audioUrl;
        voicePlayer.dataset.currentAudio = audioUrl;
        try { voicePlayer.load(); } catch (e) {}
        voicePlayer.currentTime = 0;

        voicePlayer.play().then(() => {
          console.log('In-house CapCut voice playing:', audioUrl);
        }).catch(err => {
          console.log('Server audio blocked, using speech fallback:', err);
          speakWebSpeech(textToSpeak, resetBtn);
        });

        voicePlayer.onended = resetBtn;
        voicePlayer.onerror = () => {
          console.log('Audio file load error, using speech fallback');
          speakWebSpeech(textToSpeak, resetBtn);
        };
      } else {
        speakWebSpeech(textToSpeak, resetBtn);
      }
    }

    function speakWebSpeech(text, onEndCallback) {
      if (!('speechSynthesis' in window) || !text) {
        if (onEndCallback) onEndCallback();
        return;
      }
      try {
        window.speechSynthesis.cancel();
        // Remove markdown and emojis
        const clean = text.replace(/[*#_>~`•]/g, '').replace(/[\uD800-\uDFFF]./g, '').trim();
        const utter = new SpeechSynthesisUtterance(clean);
        utter.lang = 'vi-VN';
        utter.rate = 1.0;
        utter.pitch = 1.0;

        const voices = window.speechSynthesis.getVoices();
        const viVoice = voices.find(v => v.lang.startsWith('vi') || v.lang.includes('VN'));
        if (viVoice) utter.voice = viVoice;

        utter.onend = onEndCallback;
        utter.onerror = onEndCallback;
        window.speechSynthesis.speak(utter);
      } catch (e) {
        console.log('Web speech error:', e);
        if (onEndCallback) onEndCallback();
      }
    }

    function addMessage(html, sender = 'bot', audioUrl = '', rawText = '') {
      const msgDiv = document.createElement('div');
      msgDiv.className = `flex items-end gap-2.5 bubble-animate ${sender === 'user' ? 'justify-end' : 'justify-start'}`;

      const timeStr = new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });

      if (sender === 'user') {
        msgDiv.innerHTML = `
          <div class="max-w-[85%] sm:max-w-[75%] space-y-1">
            <div class="bg-gradient-to-r from-ruby to-ruby-dark text-white px-4 py-2.5 rounded-2xl rounded-br-xs text-sm shadow-xs font-medium">
              ${html}
            </div>
            <div class="text-[10px] text-stone-400 text-right pr-1">${timeStr}</div>
          </div>
        `;
      } else {
        const textForVoice = rawText ? rawText.replace(/"/g, '&quot;') : '';
        const voiceButtonHtml = (audioUrl || textForVoice) ? `
          <div class="pt-1.5">
            <button onclick="playVoiceAudio(this)" data-audio="${audioUrl}" data-text="${textForVoice}" class="voice-play-btn inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-ruby-light/90 hover:bg-ruby hover:text-white text-ruby border border-ruby/30 text-xs font-bold transition active:scale-95 cursor-pointer shadow-xs">
              <span class="voice-btn-icon text-xs">🔊</span>
              <span class="voice-btn-label">Nghe giọng đọc</span>
            </button>
          </div>
        ` : '';

        const isFullCard = html.includes('card-invitation-root');

        msgDiv.innerHTML = `
          <img src="./assets/couple_hero.jpg" alt="Avatar" class="w-8 h-8 rounded-full object-cover shrink-0 ring-1 ring-gold/40 shadow-xs mb-1">
          <div class="${isFullCard ? 'w-full max-w-[96%] sm:max-w-[85%]' : 'max-w-[90%] sm:max-w-[80%]'} space-y-1">
            ${isFullCard ? `
              <div class="space-y-1">
                ${html}
              </div>
            ` : `
              <div class="bg-white border border-stone-200/90 text-stone-800 px-4 py-3 rounded-2xl rounded-bl-xs text-sm shadow-xs space-y-2">
                ${html}
                ${voiceButtonHtml}
              </div>
            `}
            <div class="text-[10px] text-stone-400 pl-1">${timeStr} • Tân &amp; Chi</div>
          </div>
        `;
      }

      chatContainer.appendChild(msgDiv);
      scrollToBottom();
    }

    // Header pixel mascot: Rectangular Patrol Stunt (Đi hình chữ nhật men theo 4 mép màn hình!)
    let isStuntActive = false;

    function celebrateMascot() {
      if (isStuntActive) return;
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      launchRectanglePatrol();
    }

    function launchRectanglePatrol() {
      isStuntActive = true;
      const mascot = document.getElementById('px-mascot');
      if (!mascot) { isStuntActive = false; return; }

      const r = mascot.getBoundingClientRect();
      const startX = r.left;
      const topY = r.top;
      const rightX = window.innerWidth - 44; // Góc trên phải
      const leftX = 16;                      // Góc dưới/trên trái
      const bottomY = window.innerHeight - 95; // Mép dưới đáy trên chat bar

      // Tạm ẩn mascot gốc trên header
      mascot.style.transition = 'opacity 0.2s ease';
      mascot.style.opacity = '0';

      // Tạo Actor biểu diễn
      const actor = document.createElement('div');
      actor.className = 'px-stunt-actor';
      actor.innerHTML = `
        <div class="px-bubble px-bubble-tag" style="opacity: 0; transition: opacity 0.2s;">Đi dạo nè! 🌸</div>
        <div class="px-couple px-actor-body">
          <svg class="px-art px-groom" width="24" height="32" aria-hidden="true"><use href="#px-groom"/></svg>
          <svg class="px-art px-bride" width="24" height="32" aria-hidden="true"><use href="#px-bride"/></svg>
        </div>
      `;
      actor.style.left = `${startX}px`;
      actor.style.top = `${topY}px`;
      document.body.appendChild(actor);

      const bubble = actor.querySelector('.px-bubble-tag');
      const body = actor.querySelector('.px-actor-body');

      // ==========================================
      // CẠNH 1: [startX, topY] ➔ [rightX, topY] (Chạy ngang mép trên sang góc phải)
      // ==========================================
      body.classList.add('px-runner-body');
      actor.style.transition = 'left 0.65s ease-in-out';
      requestAnimationFrame(() => {
        actor.style.left = `${rightX}px`;
      });

      // ==========================================
      // CẠNH 2: [rightX, topY] ➔ [rightX, bottomY] (Tuột thẳng đứng dọc mép phải)
      // ==========================================
      setTimeout(() => {
        body.classList.remove('px-runner-body');

        // Thả sợi dây vàng dọc mép phải
        const ropeRight = document.createElement('div');
        ropeRight.className = 'px-rope-vert';
        ropeRight.style.left = `${rightX + 16}px`;
        ropeRight.style.top = `${topY + 10}px`;
        ropeRight.style.height = `${bottomY - topY + 20}px`;
        document.body.appendChild(ropeRight);

        body.style.transform = 'rotate(8deg)';
        bubble.innerText = 'Tuột xuống nè! 🎢';
        bubble.style.opacity = '1';

        actor.style.transition = 'top 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
        actor.style.top = `${bottomY}px`;

        const dropTimerRight = setInterval(() => {
          const curR = actor.getBoundingClientRect();
          const drop = document.createElement('div');
          drop.className = 'px-trail-drop';
          drop.innerHTML = '✨';
          drop.style.left = `${curR.left + 8}px`;
          drop.style.top = `${curR.top + 8}px`;
          document.body.appendChild(drop);
          setTimeout(() => drop.remove(), 1000);
        }, 120);

        // ==========================================
        // CẠNH 3: [rightX, bottomY] ➔ [leftX, bottomY] (Chạy ngang qua đáy sang góc trái)
        // ==========================================
        setTimeout(() => {
          clearInterval(dropTimerRight);
          ropeRight.style.opacity = '0';
          setTimeout(() => ropeRight.remove(), 250);

          body.style.transform = 'scaleX(-1)'; // Quay mặt sang trái
          body.classList.add('px-runner-body');
          bubble.innerText = 'Tân & Chi qua đây! 💕';

          // Mini confetti khi tiếp đất góc phải
          if (typeof confetti === 'function') {
            confetti({
              particleCount: 10,
              spread: 35,
              origin: { x: rightX / window.innerWidth, y: bottomY / window.innerHeight },
              colors: ['#D4AF37', '#8B1E2D', '#FFB6C1']
            });
          }

          actor.style.transition = 'left 1.4s linear';
          actor.style.left = `${leftX}px`;

          // Rớt hoa & tim dọc đường chạy đáy
          const dropTimerBottom = setInterval(() => {
            const curR = actor.getBoundingClientRect();
            if (curR.left < leftX + 10) return;
            const drop = document.createElement('div');
            drop.className = 'px-trail-drop';
            drop.innerHTML = Math.random() > 0.5 ? '🌸' : '💖';
            drop.style.left = `${curR.left + 10}px`;
            drop.style.top = `${curR.top + 10}px`;
            document.body.appendChild(drop);
            setTimeout(() => drop.remove(), 1200);
          }, 200);

          // ==========================================
          // CẠNH 4: [leftX, bottomY] ➔ [leftX, topY] (Bắn dây đu thẳng đứng lên góc trên trái)
          // ==========================================
          setTimeout(() => {
            clearInterval(dropTimerBottom);
            body.classList.remove('px-runner-body');
            body.style.transform = 'none';

            // Dây leo dọc mép trái
            const ropeLeft = document.createElement('div');
            ropeLeft.className = 'px-rope-vert';
            ropeLeft.style.left = `${leftX + 12}px`;
            ropeLeft.style.top = `${topY + 10}px`;
            ropeLeft.style.height = `${bottomY - topY + 20}px`;
            document.body.appendChild(ropeLeft);

            bubble.innerText = 'Đu lên nè! 🚀';
            body.style.transform = 'rotate(-8deg)';

            actor.style.transition = 'top 0.75s cubic-bezier(0.16, 1, 0.3, 1)';
            actor.style.top = `${topY}px`;

            const dropTimerLeft = setInterval(() => {
              const curR = actor.getBoundingClientRect();
              const drop = document.createElement('div');
              drop.className = 'px-trail-drop';
              drop.innerHTML = '✨';
              drop.style.left = `${curR.left + 8}px`;
              drop.style.top = `${curR.top + 8}px`;
              document.body.appendChild(drop);
              setTimeout(() => drop.remove(), 1000);
            }, 120);

            // ==========================================
            // KHÉP GÓC: [leftX, topY] ➔ [startX, topY] (Chạy về vị trí ban đầu trên Header)
            // ==========================================
            setTimeout(() => {
              clearInterval(dropTimerLeft);
              ropeLeft.style.opacity = '0';
              setTimeout(() => ropeLeft.remove(), 250);

              body.style.transform = 'none';
              body.classList.add('px-runner-body');
              bubble.innerText = 'Về đích rồi! ✨';

              actor.style.transition = 'left 0.5s ease-out';
              actor.style.left = `${startX}px`;

              // KẾT THÚC: Tiếp đất an toàn tại Mascot Header & Ăn mừng!
              setTimeout(() => {
                actor.remove();
                mascot.style.opacity = '1';
                mascot.classList.add('is-bouncing');
                setTimeout(() => mascot.classList.remove('is-bouncing'), 700);

                // Burst of hearts
                const HEART_COUNT = 8;
                for (let i = 0; i < HEART_COUNT; i++) {
                  const spread = (i / (HEART_COUNT - 1)) * 2 - 1;
                  const heart = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                  heart.setAttribute('class', 'px-art px-heart');
                  heart.setAttribute('aria-hidden', 'true');
                  heart.innerHTML = '<use href="#px-heart"/>';
                  heart.style.setProperty('--dx', `${Math.round(spread * 35 + (Math.random() * 8 - 4))}px`);
                  heart.style.setProperty('--dy', `${Math.round(-10 - Math.random() * 15 + Math.abs(spread) * 8)}px`);
                  heart.style.animationDelay = `${i * 35}ms`;
                  heart.addEventListener('animationend', () => heart.remove(), { once: true });
                  mascot.appendChild(heart);
                }

                isStuntActive = false;
              }, 550);

            }, 800);

          }, 1450);

        }, 850);

      }, 700);
    }

    // Show/hide typing
    function setTyping(isTyping) {
      if (isTyping) {
        typingIndicator.classList.remove('hidden');
        scrollToBottom();
      } else {
        typingIndicator.classList.add('hidden');
      }
    }

    // Simulate bot reply with typing delay
    function botReply(html, delay = 700, audioUrl = '', rawText = '') {
      setTyping(true);
      setTimeout(() => {
        setTyping(false);
        addMessage(html, 'bot', audioUrl, rawText);
      }, delay);
    }

    // -------------------------------------------------------------
    // PERSONA & VOCABULARY HELPERS
    // -------------------------------------------------------------
    function decodeUnicode(str) {
      if (!str) return '';
      try {
        return str.replace(/\\u([0-9a-fA-F]{4})/g, (_, code) => String.fromCharCode(parseInt(code, 16)));
      } catch (e) {
        return str;
      }
    }

    function isElder(name, relation) {
      const combined = ((name || '') + ' ' + (relation || '')).toLowerCase();
      return /bác|chú|cô|dì|ông|bà|cụ|thím|dượng|cậu/.test(combined);
    }

    function getGuestDisplayName() {
      if (guestData && guestData.name) {
        return decodeUnicode(guestData.name);
      }
      return '';
    }

    function getRelationshipTitle() {
      if (guestData && guestData.relation) {
        return decodeUnicode(guestData.relation);
      }
      return '';
    }

    // -------------------------------------------------------------
    // RICH CONTENT CARDS TEMPLATES
    // -------------------------------------------------------------
    function cardInvitation(guest, followPrompt = '') {
      const guestName = guest ? decodeUnicode(guest.name) : 'Quý Khách';
      let guestRel = guest && guest.relation ? decodeUnicode(guest.relation) : '';
      const guestMsg = guest && guest.personal_message ? decodeUnicode(guest.personal_message) : '';
      const isBrideSide = guest && guest.side === 'bride';

      // Check if family / relatives to avoid cold "Khách Quý" and 3rd-person phrasing
      const isFamily = /bác|chú|cô|dì|ông|bà|cậu|mợ|thím|dượng|anh|chị|em ruột|ruột/.test((guestRel + ' ' + guestName).toLowerCase());
      
      let sideText = isBrideSide ? 'Khách Quý Nhà Gái' : 'Khách Quý Nhà Trai';
      if (isFamily) {
        sideText = isBrideSide ? 'Gia Đình Nhà Gái' : 'Gia Đình Nhà Trai';
      }

      // Warm, affectionate relationship phrasing
      let warmRel = guestRel;
      if (guestRel) {
        warmRel = warmRel.replace(/chú rể/gi, 'hai cháu').replace(/cô dâu/gi, 'hai cháu');
        if (/bác ruột/i.test(warmRel)) warmRel = 'Bác ruột của hai cháu';
        else if (/chú ruột/i.test(warmRel)) warmRel = 'Chú ruột của hai cháu';
        else if (/cô ruột/i.test(warmRel)) warmRel = 'Cô ruột của hai cháu';
        else if (/dì ruột/i.test(warmRel)) warmRel = 'Dì ruột của hai cháu';
        else if (/chị gái/i.test(warmRel)) warmRel = isBrideSide ? 'Chị gái của Chi' : 'Chị gái của hai đứa';
      }

      const ceremonyHeader = isBrideSide ? '✦ LỄ VU QUY ✦' : '✦ LỄ THÀNH HÔN ✦';
      const coupleNames = isBrideSide 
        ? `<div class="flex items-center justify-center gap-1.5 flex-wrap"><span class="whitespace-nowrap font-bold">ĐINH KHÁNH CHI</span><span class="text-amber-400 font-serif font-extrabold text-xl mx-1 align-middle select-none">囍</span><span class="whitespace-nowrap font-bold">LÊ DUY TÂN</span></div>`
        : `<div class="flex items-center justify-center gap-1.5 flex-wrap"><span class="whitespace-nowrap font-bold">LÊ DUY TÂN</span><span class="text-amber-400 font-serif font-extrabold text-xl mx-1 align-middle select-none">囍</span><span class="whitespace-nowrap font-bold">ĐINH KHÁNH CHI</span></div>`;
      
      const day2Name = isBrideSide ? 'Lễ Vu Quy & Khai Tiệc' : 'Lễ Thành Hôn & Khai Tiệc';

      const tagBadge = warmRel
        ? `<div class="inline-flex flex-wrap items-center justify-center gap-1 px-3 py-1 rounded-full bg-amber-400/20 text-amber-200 text-[10px] font-semibold tracking-wider border border-amber-400/35 uppercase">
            <span class="whitespace-nowrap">${sideText}</span>
            <span class="opacity-50">•</span>
            <span class="whitespace-nowrap">${warmRel}</span>
          </div>`
        : `<span class="inline-block px-3 py-0.5 rounded-full bg-amber-400/20 text-amber-200 text-[10px] font-semibold tracking-wider border border-amber-400/35 uppercase whitespace-nowrap">${sideText}</span>`;

      return `
        <div class="card-invitation-root relative overflow-hidden rounded-2xl bg-gradient-to-b from-[#7A1826] via-[#63121E] to-[#4A0B13] text-white p-1.5 shadow-2xl border-2 border-[#D4AF37]/60 max-w-sm mx-auto">
          <!-- Inner Decorative Gold Border Frame -->
          <div class="relative rounded-xl border border-[#D4AF37]/35 p-3.5 sm:p-4 bg-gradient-to-b from-white/[0.05] to-transparent">
            
            <!-- Corner Accents -->
            <div class="absolute top-1.5 left-1.5 text-[#D4AF37]/50 text-[10px] leading-none select-none">✦</div>
            <div class="absolute top-1.5 right-1.5 text-[#D4AF37]/50 text-[10px] leading-none select-none">✦</div>
            <div class="absolute bottom-1.5 left-1.5 text-[#D4AF37]/50 text-[10px] leading-none select-none">✦</div>
            <div class="absolute bottom-1.5 right-1.5 text-[#D4AF37]/50 text-[10px] leading-none select-none">✦</div>

            <!-- Top Header & Double Happiness Monogram -->
            <div class="text-center space-y-1">
              <div class="inline-flex items-center justify-center w-9 h-9 rounded-full bg-gradient-to-b from-[#F9E29D] via-[#D4AF37] to-[#99781A] text-[#60121C] font-serif font-extrabold text-lg shadow-md select-none ring-2 ring-[#F9E29D]/50">
                囍

    let chatHistory = [];

    async function queryAiApi(userMsg) {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 18000);

        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: userMsg,
            slug: guestSlug || '',
            history: chatHistory
          }),
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        if (res.ok) {
          const data = await res.json();
          if (data && data.reply) {
            return { reply: data.reply.trim(), audio_url: data.audio_url || '' };
          }
        }
      } catch (e) {
        console.log('AI API fetch error, will use gentle fallback:', e);
      }
      return null;
    }

    async function processUserInput(rawText) {
      const text = rawText.trim().toLowerCase();
      const elder = isElder(getGuestDisplayName(), getRelationshipTitle());
      const guestName = getGuestDisplayName();

      // 1. Check if we are in an ongoing RSVP question flow
      if (rsvpState.step) {
        handleRsvpStep(rawText);
        return;
      }

      // Track history
      chatHistory.push({ role: 'user', content: rawText });

      // 2. Direct chip handling for immediate UI responsiveness
      if (rawText === 'Xem lịch trình hôn lễ 📅') {
        const lead = elder 
          ? `Dạ, chúng con xin kính gửi lịch trình chi tiết hai ngày cưới của hai cháu ạ:` 
          : `Tân & Chi gửi bạn lịch trình chi tiết hai ngày cưới của chúng mình nhé:`;
        botReply(`
          <p class="text-xs text-stone-700 leading-relaxed">${lead}</p>
          ${cardSchedule()}
        `);
        return;
      }
      if (rawText === 'Xem ảnh cưới của hai bạn 📸') {
        botReply(`
          <p class="text-xs text-stone-700">Tân &amp; Chi xin gửi tặng bạn những bức hình kỷ niệm trong album cưới vừa hoàn thành nhé:</p>
          ${cardGallery()}
        `);
        return;
      }
      if (rawText === 'Mình muốn xác nhận tham dự cùng hai bạn 💌' || rawText === 'Tôi muốn xác nhận tham dự 💌') {
        botReply(cardRsvpInteractive());
        return;
      }
      if (rawText === 'Tâm sự mỏng & Mừng cưới từ xa 🎁' || rawText === 'Tâm sự mỏng & Gửi quà mừng từ xa 🎁') {
        botReply(cardGift());
        return;
      }

      // 3. For any typed text, show typing indicator and query AI backend
      setTyping(true);

      // Check if confetti needed for wishes
      if (text.includes('chúc') || text.includes('hạnh phúc') || text.includes('trăm năm') || text.includes('vẹn tròn') || text.includes('chúc mừng')) {
        saveWishToApi(guestName || 'Người bạn thân quý', rawText);
        confetti({ particleCount: 65, spread: 70, origin: { y: 0.8 } });
      }

      const aiData = await queryAiApi(rawText);
      setTyping(false);

      // Detect if user is asking for specific rich cards
      let attachedCard = '';
      if (text.includes('rsvp') || text.includes('tham dự') || text.includes('đi ăn cưới') || text.includes('báo tin')) {
        attachedCard = `<div class="pt-2">${cardRsvpInteractive()}</div>`;
      } else if (text.includes('ảnh') || text.includes('hình') || text.includes('album') || text.includes('ngắm')) {
        attachedCard = `<div class="pt-2">${cardGallery()}</div>`;
      } else if (text.includes('stk') || text.includes('tài khoản') || text.includes('mừng cưới') || text.includes('quà')) {
        attachedCard = `<div class="pt-2">${cardGift()}</div>`;
      } else if (text.includes('lịch') || text.includes('ngày') || text.includes('mấy giờ') || text.includes('thời gian')) {
        attachedCard = `<div class="pt-2">${cardSchedule()}</div>`;
      }

      if (aiData && aiData.reply) {
        const replyText = aiData.reply;
        const audioUrl = aiData.audio_url || '';
        chatHistory.push({ role: 'assistant', content: replyText });
        
        // Format markdown-like newlines into paragraphs
        const formattedReply = replyText
          .split(/\n\n+/)
          .map(p => `<p class="text-xs leading-relaxed text-stone-700">${p.replace(/\n/g, '<br>')}</p>`)
          .join('');

        addMessage(`
          <div class="space-y-2">
            ${formattedReply}
            ${attachedCard}
          </div>
        `, 'bot', audioUrl, replyText);
      } else {
        // Fallback response if AI API is temporarily unavailable
        botReply(`

            <p class="text-xs text-stone-700 leading-relaxed">
              Tân &amp; Chi cảm ơn lời nhắn của bạn nhiều nha! Tụi mình luôn ở đây để sẻ chia mọi thông tin về ngày vui cùng bạn.

              <button onclick="handleQuickSend('Xem lịch trình hôn lễ 📅')" class="px-2.5 py-1 rounded-full bg-stone-100 hover:bg-stone-200 text-stone-700 border border-stone-200 font-medium">📅 Lịch trình</button>

    function handleRsvpStep(input) {
      const elder = isElder(getGuestDisplayName(), getRelationshipTitle());

      if (rsvpState.step === 'name') {
        rsvpState.name = input;
        rsvpState.step = 'phone';
        
        const phonePrompt = elder
          ? `Dạ chúng con cảm ơn ạ! Xin gửi giúp chúng con <strong>Số điện thoại hoặc Zalo</strong> để tiện gửi thiệp mời và thông tin hướng dẫn đường đi chu đáo ạ:`

        botReply(`
          <p class="text-xs leading-relaxed text-stone-700">${phonePrompt}</p>
        `);
      } else if (rsvpState.step === 'phone') {
        rsvpState.phone = input;
        
        if (!rsvpState.attend) {
          finishRsvp();
        } else {
          rsvpState.step = 'plusOne';
          const plusPrompt = elder
            ? `Dạ gia đình mình dự định đi mấy người ạ? Để chúng con sắp xếp chỗ ngồi và bàn tiệc thật thoải mái nhất cho cả nhà mình ạ:`

          botReply(`
            <div class="space-y-2">
              <p class="text-xs leading-relaxed text-stone-700">${plusPrompt}</p>
              <div class="flex flex-wrap gap-1.5 pt-1 text-xs">
                <button onclick="handleQuickSend('Đi 1 mình')" class="px-3 py-1 rounded-full bg-stone-100 hover:bg-stone-200 border border-stone-200">Đi 1 mình</button>
                <button onclick="handleQuickSend('Đi cùng 1 người (+1)')" class="px-3 py-1 rounded-full bg-stone-100 hover:bg-stone-200 border border-stone-200">Đi cùng 1 người (+1)</button>
                <button onclick="handleQuickSend('Cả nhà 3-4 người')" class="px-3 py-1 rounded-full bg-stone-100 hover:bg-stone-200 border border-stone-200">Cả nhà 3-4 người</button>
              </div>
            </div>
          `);
        }
      } else if (rsvpState.step === 'plusOne') {
        if (input.includes('1 mình')) rsvpState.plusOne = 0;
        else if (input.includes('+1') || input.includes('1 người')) rsvpState.plusOne = 1;
        else rsvpState.plusOne = 2;

        finishRsvp();
      }
    }

    async function finishRsvp() {
      rsvpState.step = null;

      try {
        await fetch('/api/invite/rsvp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: rsvpState.name,
            phone: rsvpState.phone,
            side: rsvpState.side || 'groom',
            attending: rsvpState.attend,
            plus_one: rsvpState.plusOne,
            diet: 'Tiệc mặn tiêu chuẩn',
            message: `Xác nhận qua Chat AI (${rsvpState.attend ? 'Tham dự' : 'Bận'})`,
            slug: guestSlug || ''
          })
        });
      } catch (e) {
        console.log('RSVP api call completed:', e);
      }

      if (rsvpState.attend) {
        confetti({ particleCount: 75, spread: 80, origin: { y: 0.7 } });
        const plusOneLabel = rsvpState.plusOne === 0 ? 'Đi 1 mình' : (rsvpState.plusOne === 1 ? '2 người (Bạn + 1 người thân)' : 'Gia đình (3-4 người)');
        
        botReply(`
          <div class="space-y-2 p-1 text-stone-800">
            <p class="font-bold text-ruby text-sm flex items-center gap-1.5">
              <span>💌</span> Lời hẹn đã được Tân &amp; Chi nâng niu lưu lại!
            </p>
            <div class="text-xs bg-amber-50/70 p-3 rounded-xl border border-gold/30 space-y-1">
              <p>• Khách mời: <strong>${rsvpState.name}</strong></p>
              <p>• SĐT / Zalo: <strong>${rsvpState.phone}</strong></p>
              <p>• Dự kiến tham dự: <strong>${plusOneLabel}</strong></p>
              <p>• Lịch hẹn: <strong>Ngày 16 &amp; 17 Tháng 1 Năm 2027 tại Tư Gia Nhà Gái</strong></p>
            </div>
            <p class="text-xs text-stone-600 leading-relaxed">
              Cảm ơn bạn rất nhiều! Tụi mình đang đếm từng ngày để được gặp và đón tiếp bạn trong ngày vui ấm áp này.
            </p>
            <p class="text-[10px] text-stone-400 italic">Nếu có bất kỳ thay đổi nào, bạn chỉ cần nhắn lại vào khung chat bất cứ lúc nào nhé!</p>
          </div>
        `);
      } else {
        botReply(`
          <div class="space-y-2 text-stone-800">
            <p class="font-bold text-stone-900 text-sm">💌 LỜI NHẮN ĐÃ ĐƯỢC LƯU LẠI</p>
            <p class="text-xs text-stone-600 leading-relaxed">
              Tân &amp; Chi rất hiểu và cảm ơn <strong>${rsvpState.name}</strong> nhiều lắm! Dù xa xôi hay bận rộn không thể về chung vui trực tiếp, chỉ cần nhận được lời chúc và tình cảm của bạn là hai đứa đã thấy ấm lòng vô cùng rồi. Chúc bạn luôn bình an và nhiều niềm vui nhé! 🌸
            </p>
          </div>
        `);
      }
    }

    async function saveWishToApi(name, wishText) {
      try {
        await fetch('/api/invite/wish', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: name,
            wish: wishText,
            slug: guestSlug || ''
          })
        });
      } catch (err) {
        console.log('Wish save error:', err);
      }
    }

    // -------------------------------------------------------------
    // INPUT HANDLING & FORM SUBMISSION
    // -------------------------------------------------------------
    function handleFormSubmit(e) {
      e.preventDefault();
      const val = chatInput.value.trim();
      if (!val) return;

      addMessage(val, 'user');
      chatInput.value = '';
      processUserInput(val);
    }

    function handleQuickSend(text) {
      addMessage(text, 'user');
      processUserInput(text);
    }

    // -------------------------------------------------------------
    // INITIALIZATION & WELCOME MESSAGE
    // -------------------------------------------------------------
    async function initChat() {
      guestSlug = getUrlParam('g');

      if (guestSlug) {
        try {
          const res = await fetch('/api/invite/guest/' + encodeURIComponent(guestSlug));
          if (res.ok) {
            guestData = await res.json();
            if (guestData && guestData.name) {
              rsvpState.side = guestData.side || 'groom';
            }
          }
        } catch (e) {
          console.log('Guest lookup err:', e);
        }
      }

      const guestName = getGuestDisplayName();
      const guestRel = getRelationshipTitle();
      const elder = isElder(guestName, guestRel);

      // Initial Bot Greetings
      setTyping(true);
      setTimeout(() => {
        setTyping(false);

        let welcomeText = '';
        if (elder) {
          welcomeText = `
            <div class="space-y-2">
              <p class="text-sm font-semibold text-stone-900">
                Dạ, chúng con kính chào ${guestName || 'Gia đình mình'} ạ! 🌸
              </p>
              <p class="text-xs text-stone-700 leading-relaxed">
                Chúng con là <strong>Lê Duy Tân &amp; Đinh Khánh Chi</strong>. Thật hạnh phúc cho hai cháu khi được gửi lời mời trân trọng nhất đến ${guestName || 'Bác cùng toàn thể gia đình'} về chung vui ngày đại hỷ của hai cháu ạ!
              </p>
            </div>
          `;
        } else {
          const salutation = guestName ? `Chào ${guestName} thân thương! 🌸` : `Chào bạn thân thương! 🌸`;
          welcomeText = `
            <div class="space-y-2">
              <p class="text-sm font-semibold text-stone-900">
                ${salutation}
              </p>
              <p class="text-xs text-stone-700 leading-relaxed">
                Tụi mình là <strong>Lê Duy Tân &amp; Đinh Khánh Chi</strong>. Cảm ơn bạn đã ghé thăm góc nhỏ của hai đứa. Ngày vui của chúng mình sẽ trọn vẹn và ấm áp hơn rất nhiều khi có sự chúc phúc và đồng hành của bạn.
              </p>
            </div>
          `;
        }

        const welcomeAudio = elder 
          ? '/voices/welcome_elder_linh.mp3' 
          : '/voices/welcome_friend_linh.mp3';

        const cleanWelcomeText = elder
          ? `Dạ, chúng con kính chào ${guestName || 'Gia đình mình'} ạ! Chúng con là Lê Duy Tân và Đinh Khánh Chi. Thật hạnh phúc cho hai cháu khi được gửi lời mời trân trọng nhất đến ${guestRel ? guestRel + ' cùng toàn thể gia đình' : (guestName || 'gia đình mình')} về chung vui ngày đại hỷ của hai cháu ạ!`
          : `Chào bạn thân thương! Tụi mình là Lê Duy Tân và Đinh Khánh Chi. Cảm ơn bạn đã ghé thăm góc nhỏ của hai đứa. Ngày vui của chúng mình sẽ trọn vẹn và ấm áp hơn rất nhiều khi có sự chúc phúc và đồng hành của bạn.`;

        addMessage(welcomeText, 'bot', welcomeAudio, cleanWelcomeText);

        // Follow up with Invitation Card
        setTimeout(() => {
          const followPrompt = elder
            ? `Dạ, ${guestName || 'Gia đình mình'} có điều gì cần hỏi han hay dặn dò cứ nhắn tin ở đây cho hai cháu nhé, cháu sẽ giải đáp toàn bộ và thật chu đáo ạ! 🌸`
            : `Bạn có điều gì cần hỏi han hay dặn dò cứ nhắn tin ở đây nhé, tụi mình sẽ giải đáp toàn bộ nha! 💕`;

          botReply(cardInvitation(guestData, followPrompt), 600);
        }, 500);

      }, 700);
    }


    // -------------------------------------------------------------
    // IN-HOUSE SPEECH RECOGNITION (STT) VIA /api/stt & WEB SPEECH
    // -------------------------------------------------------------
    let mediaRecorder = null;
    let audioChunks = [];
    let isSpeechRecording = false;
    let speechRecognizer = null;

    function updateMicUI(recording) {
      const micBtn = document.getElementById('chat-mic-btn');
      const micRing = document.getElementById('mic-pulse-ring');
      const micSvg = document.getElementById('mic-icon-svg');

      if (recording) {
        micBtn.classList.add('bg-red-50', 'border-red-400');
        micRing.classList.remove('hidden');
        micSvg.classList.add('text-red-600');
      } else {
        micBtn.classList.remove('bg-red-50', 'border-red-400');
        micRing.classList.add('hidden');
        micSvg.classList.remove('text-red-600');
      }
    }

    async function toggleVoiceRecognition() {
      // 1. If currently recording, stop it
      if (isSpeechRecording) {
        if (mediaRecorder && mediaRecorder.state === 'recording') {
          mediaRecorder.stop();
        } else if (speechRecognizer) {
          speechRecognizer.stop();
        }
        isSpeechRecording = false;
        updateMicUI(false);
        return;
      }

      // 2. Try in-house MediaRecorder -> /api/stt (Deepgram Nova-3 Tiếng Việt)
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          audioChunks = [];
          
          let mimeType = 'audio/webm';
          if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
            mimeType = 'audio/webm;codecs=opus';
          } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
            mimeType = 'audio/mp4';
          }

          mediaRecorder = new MediaRecorder(stream, { mimeType: mimeType });
          
          mediaRecorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) audioChunks.push(e.data);
          };

          mediaRecorder.onstop = async () => {
            isSpeechRecording = false;
            updateMicUI(false);
            stream.getTracks().forEach(t => t.stop());

            if (audioChunks.length === 0) return;
            showToast('Đang nhận diện giọng nói... ✨');
            const audioBlob = new Blob(audioChunks, { type: mimeType });

            try {
              const res = await fetch('/api/stt', {
                method: 'POST',
                headers: { 'Content-Type': mimeType },
                body: audioBlob
              });
              if (res.ok) {
                const data = await res.json();
                if (data && data.transcript && data.transcript.trim()) {
                  chatInput.value = data.transcript.trim();
                  showToast(`Nhận diện: "${data.transcript.trim()}" ✨`);
                  handleFormSubmit(new Event('submit'));
                  return;
                }
              }
            } catch (err) {
              console.log('In-house STT error:', err);
            }
            showToast('Không nghe rõ, bạn thử nói lại hoặc gõ chữ nhé!');
          };

          mediaRecorder.start();
          isSpeechRecording = true;
          updateMicUI(true);
          showToast('Đang lắng nghe... Hãy nói điều gì đó nha 🎙️');
          return;
        } catch (err) {
          console.log('MediaRecorder mic error, falling back to Web Speech:', err);
        }
      }

      // 3. Fallback to browser SpeechRecognition
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRecognition) {
        if (!speechRecognizer) {
          speechRecognizer = new SpeechRecognition();
          speechRecognizer.lang = 'vi-VN';
          speechRecognizer.continuous = false;
          speechRecognizer.interimResults = false;

          speechRecognizer.onstart = () => {
            isSpeechRecording = true;
            updateMicUI(true);
            showToast('Đang lắng nghe giọng nói của bạn... 🎙️');
          };

          speechRecognizer.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            if (transcript) {
              chatInput.value = transcript;
              showToast(`Nhận diện: "${transcript}" ✨`);
              handleFormSubmit(new Event('submit'));
            }
          };

          speechRecognizer.onerror = () => {
            isSpeechRecording = false;
            updateMicUI(false);
          };

          speechRecognizer.onend = () => {
            isSpeechRecording = false;
            updateMicUI(false);
          };
        }

        try {
          speechRecognizer.start();
          return;
        } catch (e) {
          console.log('SpeechRecognizer error:', e);
        }
      }

      showToast('Vui lòng cho phép quyền Micro hoặc gõ chữ giúp tụi mình nhé!');
      chatInput.focus();
    }

    document.addEventListener('DOMContentLoaded', initChat);
  </script>
